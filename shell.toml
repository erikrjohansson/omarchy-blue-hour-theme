selected-background = "#44536C"
selected-background-alpha = 1.0
selected-text = "#F0F3FA"
selected-border = "#A6B9DA"
selected-border-alpha = 0.35

[menu]
background = "#2D394A"
background-alpha = 0.88
text = "#DEE5F0"
border = "#51627A"
border-alpha = 1.0
scrim = "#151C27"
scrim-alpha = 0.35
selected-background = "#44536C"
selected-background-alpha = 1.0
selected-text = "#F0F3FA"
selected-border = "#A6B9DA"
