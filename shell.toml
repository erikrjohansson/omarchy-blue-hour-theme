[bar]
background = "#03111D"
background-alpha = 0.98
text = "#C8D7ED"
active = "#98BAE5"
scale-with-font = true
size-horizontal = 26
size-vertical = 28

[hyprland]
active-border = "#426593"
active-border-foreground = "#426593"

[controls]
normal-color = "#DCE5F4"
normal-fill-alpha = 0.04
normal-border = "#DCE5F4"
normal-border-width = 1
normal-border-alpha = 0.4
hover-cursor-color = "#98BAE5"
hover-cursor-fill-alpha = 0.08
hover-cursor-border = "#98BAE5"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.25
focus-color = "#98BAE5"
focus-fill-alpha = 0.08
focus-border = "#98BAE5"
focus-border-width = 1
focus-border-alpha = 0.65
selected-color = "#98BAE5"
selected-fill-alpha = 0.18
selected-border = "#98BAE5"
selected-border-width = 0
selected-border-alpha = 1.0
pressed-fill-alpha = 0.22
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background = "#061C2B"
background-alpha = 0.88
text = "#DCE5F4"
border = "#1B3850"
border-alpha = 1.0
border-width = 1

[tooltip]
background = "#061C2B"
background-alpha = 0.88
text = "#DCE5F4"
border = "#1B3850"
border-alpha = 1.0

[notifications]
background = "#061C2B"
background-alpha = 0.88
text = "#DCE5F4"
border = "#1B3850"
border-alpha = 1.0
border-width = 1
countdown = "#98BAE5"

[launcher]
background = "#061C2B"
background-alpha = 0.88
text = "#DCE5F4"
border = "#1B3850"
border-alpha = 1.0
scrim = "#01070E"
scrim-alpha = 0.35
selected-background = "#123552"
selected-background-alpha = 1.0
selected-text = "#EEF4FB"
selected-border = "#98BAE5"
selected-border-alpha = 0.35

[menu]
background = "#061C2B"
background-alpha = 0.88
text = "#DCE5F4"
border = "#1B3850"
border-alpha = 1.0
scrim = "#01070E"
scrim-alpha = 0.35
selected-background = "#123552"
selected-background-alpha = 1.0
selected-text = "#EEF4FB"
selected-border = "#98BAE5"
selected-border-alpha = 0.35

[polkit]
background = "#061C2B"
background-alpha = 0.88
text = "#DCE5F4"
text-error = "#D4A6AD"
border = "hyprland.active-border"
border-error = "#D4A6AD"
border-alpha = 1.0
scrim = "#01070E"
scrim-alpha = 0.5
accent = "#98BAE5"

[lock]
background = "#03111D"
background-alpha = 0.88
text = "#DCE5F4"
placeholder = "#ADC1DC"
text-error = "#D4A6AD"
border = "#1B3850"
border-active = "#98BAE5"
border-error = "#D4A6AD"
border-alpha = 1.0
selection = "#98BAE5"
selection-alpha = 0.15

[image-picker]
scrim = "#01070E"
scrim-alpha = 0.5
text = "#DCE5F4"
selected-border = "#98BAE5"
selected-border-alpha = 1.0
unselected-border = "#DCE5F4"
unselected-border-alpha = 0.28
